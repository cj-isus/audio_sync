# ===============================================================================
# КОНФИГУРАЦИЯ GRADLE ДЛЯ РОССИЙСКИХ СТАНДАРТОВ
# Проект: АудиоСинхронизатор - Многоустройственная синхронная стерео-система
# ===============================================================================
# Данный файл содержит настройки Gradle, оптимизированные для разработки
# в соответствии с российскими стандартами и требованиями
# ===============================================================================

# ===============================================================================
# НАСТРОЙКИ КОДИРОВКИ И ЛОКАЛИЗАЦИИ
# ===============================================================================

# Кодировка файлов (поддержка русского языка)
# Java SDK Path для Android Studio JBR
# КРИТИЧЕСКИ ВАЖНО: Обновлено на JDK 21 для production-ready системы
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# Кодировка для компилятора Kotlin (поддержка кириллических символов)
kotlin.code.style=official
kotlin.incremental=true

# ===============================================================================
# НАСТРОЙКИ ANDROID SDK (РОССИЙСКИЕ ТРЕБОВАНИЯ)
# ===============================================================================

# Минимальная версия Android SDK для российского рынка
android.minSdkVersion=26
android.targetSdkVersion=35
android.compileSdkVersion=35

# Поддержка векторных drawable для российских устройств
android.useAndroidX=true
android.enableJetifier=true

# Разрешение для legacy библиотек (совместимость с российским ПО)
android.suppressUnsupportedCompileSdk=34

# ===============================================================================
# ОПТИМИЗАЦИЯ СБОРКИ ДЛЯ РОССИЙСКОЙ РАЗРАБОТКИ
# ===============================================================================

# Параллельная сборка (ускорение на российском оборудовании)
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# Увеличенный таймаут для нестабильного интернета в регионах РФ
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# Daemon для ускорения повторных сборок
org.gradle.daemon=true

# ===============================================================================
# НАСТРОЙКИ БЕЗОПАСНОСТИ (ГОСТ Р 50922-2006)
# ===============================================================================

# Минификация кода для защиты интеллектуальной собственности
android.enableResourceOptimizations=true

# ===============================================================================
# ПОДДЕРЖКА РОССИЙСКИХ АРХИТЕКТУР ПРОЦЕССОРОВ
# ===============================================================================

# ABI фильтры для российских устройств (включая Эльбрус)
android.defaultConfig.ndk.abiFilters=armeabi-v7a,arm64-v8a,x86,x86_64

# ===============================================================================
# НАСТРОЙКИ ДЛЯ JETPACK COMPOSE
# ===============================================================================

# Включение Compose Compiler Metrics (анализ производительности)
android.experimental.enableComposeCompilerMetrics=true
android.experimental.enableComposeCompilerReports=true

# Стабильность Compose для российских устройств различной мощности
android.defaults.buildfeatures.compose=true

# ===============================================================================
# НАСТРОЙКИ ВЕРСИОНИРОВАНИЯ (ГОСТ 34.602-89)
# ===============================================================================

# Автоматическое версионирование согласно российским стандартам
VERSION_NAME=1.0.0
VERSION_CODE=1

# Суффиксы для различных типов сборок
VERSION_NAME_SUFFIX_DEBUG=-ОТЛАДКА
VERSION_NAME_SUFFIX_BETA=-БЕТА
VERSION_NAME_SUFFIX_RC=-РК

# ===============================================================================
# НАСТРОЙКИ ТЕСТИРОВАНИЯ
# ===============================================================================

# Включение тестирования на российских устройствах
android.testInstrumentationRunnerArguments.clearPackageData=true

# Parallel execution для ускорения тестов
android.testOptions.execution=ANDROIDX_TEST_ORCHESTRATOR

# ===============================================================================
# НАСТРОЙКИ СЕТИ И РЕПОЗИТОРИЕВ
# ===============================================================================

# Использование российских зеркал репозиториев (при необходимости)
# Раскомментировать при проблемах с доступом к международным репозиториям
# systemProp.http.proxyHost=proxy.company.ru
# systemProp.http.proxyPort=8080
# systemProp.https.proxyHost=proxy.company.ru  
# systemProp.https.proxyPort=8080

# Таймауты для загрузки зависимостей
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=1000

# ===============================================================================
# НАСТРОЙКИ ДЛЯ CI/CD В РОССИЙСКОЙ ИНФРАСТРУКТУРЕ
# ===============================================================================

# Отключение анимаций на серверах сборки
android.testInstrumentationRunnerArguments.disableAnalytics=true

# Настройки для GitLab CI / Jenkins (популярные в России)
org.gradle.logging.level=info
org.gradle.console=plain

# ===============================================================================
# ЭКСПЕРИМЕНТАЛЬНЫЕ ФУНКЦИИ
# ===============================================================================

# Новые функции Gradle (с осторожностью для стабильности в РФ)
org.gradle.unsafe.configuration-cache=false
org.gradle.unsafe.configuration-cache-problems=warn

# ===============================================================================
# НАСТРОЙКИ ЛОКАЛИЗАЦИИ ПРИЛОЖЕНИЯ
# ===============================================================================

# Основная локаль приложения - русский язык
android.defaultConfig.resConfigs=ru,en

# Поддержка RTL (для многоязычности при экспорте)
android.defaultConfig.supportRtl=true

# ===============================================================================
# КОММЕНТАРИИ ПО ИСПОЛЬЗОВАНИЮ
# ===============================================================================
# 
# Данный файл оптимизирован для:
# 1. Разработки в российской корпоративной среде
# 2. Соответствия российским стандартам качества ПО
# 3. Работы с российскими устройствами и инфраструктурой
# 4. Поддержки русского языка на всех уровнях
# 5. Соблюдения требований информационной безопасности РФ
#
# При изменении настроек обязательно проверьте совместимость с:
# - Российскими устройствами (включая специфичные модели)
# - Корпоративной инфраструктурой разработки
# - Требованиями по локализации и безопасности
# ===============================================================================

# ============================================================================================
# ГЛОБАЛЬНЫЕ НАСТРОЙКИ GRADLE ДЛЯ ПРОЕКТА АУДИОСИНХРОНИЗАТОР
# ============================================================================================

# Отключение проверки пути с non-ASCII символами
android.overridePathCheck=true

# Настройки производительности Gradle - оптимизировано для Gradle 9.0.0 и JDK 21
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Настройки Android
android.useAndroidX=true
android.enableJetifier=true

# Kotlin настройки
kotlin.code.style=official

# Отключение предупреждений об устаревших возможностях
android.suppressUnsupportedCompileSdk=true
