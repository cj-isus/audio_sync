# ===============================================================================
# КОНФИГУРАЦИЯ DETEKT ДЛЯ СТАТИЧЕСКОГО АНАЛИЗА КОДА
# Проект: АудиоСинхронизатор - соответствие российским стандартам качества
# ===============================================================================
# Данная конфигурация обеспечивает соответствие кода российским стандартам
# качества программного обеспечения согласно ГОСТ Р ИСО/МЭК 25010-2015
# ===============================================================================

# ===============================================================================
# ОСНОВНЫЕ НАСТРОЙКИ
# ===============================================================================
build:
  maxIssues: 0  # Требование нулевого количества критических проблем (стандарт качества РФ)
  excludeCorrectable: false
  weights:
    complexity: 2      # Высокий приоритет для сложности (ГОСТ 28806-90)
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warningsAsErrors: true  # Все предупреждения считаются ошибками (стандарт качества)
  checkExhaustiveness: true

processors:
  active: true

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
    - 'FindingsReport'
    - 'FileBasedFindingsReport'

# ===============================================================================
# ПРОВЕРКА СЛОЖНОСТИ КОДА (ГОСТ 28806-90)
# ===============================================================================
complexity:
  active: true
  
  # Цикломатическая сложность (критерий качества по российским стандартам)
  CyclomaticComplexMethod:
    active: true
    threshold: 10  # Максимально допустимая сложность согласно российским стандартам
    ignoreSingleWhenExpression: false
    ignoreSimpleWhenEntries: false
    ignoreNestingFunctions: false
    nestingFunctions:
      - 'also'
      - 'apply'
      - 'forEach'
      - 'isNotNull'
      - 'ifNull'

  # Сложность конструктора
  ComplexConstructor:
    active: true
    threshold: 7

  # Сложность интерфейса
  ComplexInterface:
    active: true
    threshold: 10
    includeStaticDeclarations: false
    includePrivateDeclarations: false

  # Метод с большим количеством параметров (стандарт читаемости)
  LongParameterList:
    active: true
    functionThreshold: 6  # Максимум параметров для функций
    constructorThreshold: 7  # Максимум параметров для конструкторов
    ignoreDefaultParameters: false
    ignoreDataClasses: true
    ignoreAnnotatedParameter: []

  # Большой класс (принцип единственной ответственности)
  LargeClass:
    active: true
    threshold: 600  # Максимум строк в классе

  # Слишком много методов в классе
  TooManyFunctions:
    active: true
    thresholdInFiles: 11
    thresholdInClasses: 11
    thresholdInInterfaces: 11
    thresholdInObjects: 11
    thresholdInEnums: 11
    ignoreDeprecated: false
    ignorePrivate: false
    ignoreOverridden: false

# ===============================================================================
# ПРАВИЛА ИМЕНОВАНИЯ (СООТВЕТСТВИЕ РУССКИМ СТАНДАРТАМ)
# ===============================================================================
naming:
  active: true
  
  # Классы с русскими названиями (разрешены кириллические символы)
  ClassNaming:
    active: true
    classPattern: '[А-ЯA-Z][а-яёА-ЯЁa-zA-Z0-9]*'  # Поддержка русских названий классов

  # Функции с русскими названиями
  FunctionNaming:
    active: true
    functionPattern: '[а-яёa-z][а-яёА-ЯЁa-zA-Z0-9]*'  # camelCase с русскими символами
    excludeClassPattern: '$^'
    ignoreAnnotated: ['Composable']

  # Константы с русскими названиями
  ConstantNaming:
    active: true
    constantPattern: '[А-ЯЁA-Z][_А-ЯЁA-Z0-9]*'  # SCREAMING_SNAKE_CASE с кириллицей

  # Переменные с русскими названиями
  VariableNaming:
    active: true
    variablePattern: '[а-яёa-z][а-яёА-ЯЁa-zA-Z0-9]*'  # camelCase с русскими символами

  # Пакеты с русскими названиями
  PackageNaming:
    active: true
    packagePattern: '[а-яёa-z_.]+'  # Разрешены русские названия пакетов

  # Имена файлов с русскими символами
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[А-ЯЁA-Z][_А-ЯЁA-Z0-9]*'
    propertyPattern: '[а-яёa-z][а-яёА-ЯЁa-zA-Z0-9]*'
    privatePropertyPattern: '[а-яёa-z][а-яёА-ЯЁa-zA-Z0-9]*'

# ===============================================================================
# СТИЛЬ КОДА (РОССИЙСКИЕ СТАНДАРТЫ)
# ===============================================================================
style:
  active: true

  # Документация для публичных API (требование ГОСТ)
  UndocumentedPublicClass:
    active: true
    excludes: ['**/*Test.kt', '**/*Tests.kt']

  UndocumentedPublicFunction:
    active: true
    excludes: ['**/*Test.kt', '**/*Tests.kt']

  # Запрет на TODO в продакшен коде
  ForbiddenComment:
    active: true
    values: 
      - 'TODO:'
      - 'FIXME:'
      - 'STOPSHIP:'
      - 'XXX:'
    allowedPatterns: ""

  # Использование русского языка в комментариях
  CommentOverPrivateFunction:
    active: false  # Отключаем, так как не все private функции нуждаются в комментариях

  # Длина строки (стандарт читаемости)
  MaxLineLength:
    active: true
    maxLineLength: 120  # Соответствует российским стандартам
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: false

# ===============================================================================
# ОБРАБОТКА ИСКЛЮЧЕНИЙ (БЕЗОПАСНОСТЬ КОДА)
# ===============================================================================
exceptions:
  active: true

  # Обязательная обработка исключений (требование безопасности)
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - ArrayIndexOutOfBoundsException
      - Error
      - Exception
      - IllegalMonitorStateException
      - NullPointerException
      - IndexOutOfBoundsException
      - RuntimeException
      - Throwable
    allowedExceptionNameRegex: "^(_|(ignore|expected).*)"

  # Запрет на проглатывание исключений
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
    allowedExceptionNameRegex: "^(_|(ignore|expected).*)"

# ===============================================================================
# ПРОИЗВОДИТЕЛЬНОСТЬ
# ===============================================================================
performance:
  active: true

  # Оптимизация циклов
  ForEachOnRange:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/*.Test.kt', '**/*.Spec.kt']

  # Избегание создания ненужных объектов
  SpreadOperator:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/*.Test.kt', '**/*.Spec.kt']

# ===============================================================================
# ПОТЕНЦИАЛЬНЫЕ ОШИБКИ
# ===============================================================================
potential-bugs:
  active: true

  # Проверка на NullPointerException
  LateinitUsage:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/*.Test.kt', '**/*.Spec.kt']
    ignoreOnClassesPattern: ""

  # Проверка безопасности приведения типов
  UnsafeCast:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/*.Test.kt', '**/*.Spec.kt']

# ===============================================================================
# КОРУТИНЫ (СПЕЦИФИЧНО ДЛЯ ANDROID)
# ===============================================================================
coroutines:
  active: true

  # Правильное использование Dispatchers
  SuspendFunWithFlowReturnType:
    active: true

  # Избегание GlobalScope
  GlobalCoroutineUsage:
    active: true

  # Правильная отмена корутин
  RedundantSuspendModifier:
    active: true

# ===============================================================================
# ИСКЛЮЧЕНИЯ ДЛЯ ТЕСТОВЫХ ФАЙЛОВ
# ===============================================================================
# Менее строгие правила для тестов
test-pattern: # Шаблоны для тестовых файлов
  - '*/test/**'
  - '*/androidTest/**'
  - '**/test/**'
  - '**/androidTest/**'
  - '**/*Test.kt'
  - '**/*Tests.kt'
  - '**/*Spec.kt'