# ============================================================================================
# ЦЕНТРАЛИЗОВАННЫЙ КАТАЛОГ ВЕРСИЙ БИБЛИОТЕК
# Проект: АудиоСинхронизатор - Многоустройственная синхронная стерео-система
# ============================================================================================
# 
# Устраняет дублирование зависимостей и версий во всех модулях проекта.
# Обеспечивает консистентность версий библиотек и упрощает обновление.
# ============================================================================================

[versions]
# ============================================================================================
# КРИТИЧЕСКИ ВАЖНЫЕ СИСТЕМНЫЕ ВЕРСИИ ДЛЯ PRODUCTION-READY СИСТЕМЫ
# ОБНОВЛЕНО НА ИЮЛЬ 2025: НОВЕЙШИЕ СТАБИЛЬНЫЕ ВЕРСИИ ДЛЯ МАКСИМАЛЬНОЙ ПРОИЗВОДИТЕЛЬНОСТИ
# ============================================================================================
kotlin = "2.2.0"
android-gradle = "8.10.0"
compileSdk = "35"
minSdk = "26"
targetSdk = "35"

# ============================================================================================
# ОСНОВНЫЕ БИБЛИОТЕКИ ANDROID
# ============================================================================================
androidx-core = "1.15.0"
androidx-lifecycle = "2.8.7"
androidx-activity = "1.9.3"
androidx-navigation = "2.8.4"

# ============================================================================================
# JETPACK COMPOSE - КРИТИЧЕСКИ ВАЖЕН ДЛЯ UI АРХИТЕКТУРЫ
# ============================================================================================
compose-bom = "2024.12.01"
compose-compiler = "1.5.15"  # Используем стабильную версию компилятора

# ============================================================================================
# DEPENDENCY INJECTION - ОСНОВА CLEAN ARCHITECTURE
# ============================================================================================
hilt = "2.57"

# ============================================================================================
# АСИНХРОННОЕ ПРОГРАММИРОВАНИЕ
# ============================================================================================
coroutines = "1.9.0"

# ============================================================================================
# АУДИО И МУЛЬТИМЕДИА - СЕРДЦЕ АУДИОСИНХРОНИЗАТОРА
# ============================================================================================
media3 = "1.7.0"
# ffmpeg = "4.4"  # УДАЛЕНО: библиотека больше не поддерживается

# ============================================================================================
# СЕТЕВЫЕ БИБЛИОТЕКИ
# ============================================================================================
retrofit = "2.11.0"
okhttp = "4.12.0"
ktor = "2.3.12"
# webrtc = "1.0.32006"  # УДАЛЕНО: библиотека больше не поддерживается

# ============================================================================================
# БАЗЫ ДАННЫХ И ХРАНИЛИЩЕ
# ============================================================================================
room = "2.7.0"
datastore = "1.1.1"

# ============================================================================================
# МАТЕМАТИЧЕСКИЕ И НАУЧНЫЕ БИБЛИОТЕКИ
# ============================================================================================
commons-math = "3.6.1"
# commons-net = "3.8.0"  # УДАЛЕНО: библиотека недоступна в Maven Central

# ============================================================================================
# КРИТИЧЕСКИ ВАЖНЫЕ ТЕСТИРОВАНИЕ И ПРОИЗВОДИТЕЛЬНОСТЬ
# ============================================================================================
junit = "4.13.2"
androidx-junit = "1.2.1"
espresso = "3.6.1"
robolectric = "4.13"
mockito = "5.14.2"
benchmark = "1.4.0"
androidx-test-orchestrator = "1.5.1"

# ============================================================================================
# ДОПОЛНИТЕЛЬНЫЕ БИБЛИОТЕКИ
# ============================================================================================
accompanist = "0.32.0"
zxing = "4.3.0"
chronicle-map = "3.24.4"
jmdns = "3.5.8"
vorbis-java = "0.8"
glide-disklrucache = "4.16.0"
tracing = "1.2.0"

[libraries]
# ============================================================================================
# ANDROID CORE
# ============================================================================================
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "androidx-lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }

# ============================================================================================
# JETPACK COMPOSE
# ============================================================================================
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

# ============================================================================================
# NAVIGATION
# ============================================================================================
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidx-navigation" }

# ============================================================================================
# DEPENDENCY INJECTION - HILT
# ============================================================================================
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-core = { group = "com.google.dagger", name = "hilt-core", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.1.0" }

# ============================================================================================
# COROUTINES
# ============================================================================================
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# ============================================================================================
# АУДИО И МУЛЬТИМЕДИА
# ============================================================================================
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
# ffmpeg-mobile = { group = "com.arthenica", name = "mobile-ffmpeg-full", version.ref = "ffmpeg" }  # УДАЛЕНО
# bluetoothx = { group = "androidx.bluetooth", name = "bluetooth", version = "1.0.0-alpha02" }  # УДАЛЕНО: альфа версия недоступна
# bluetoothx-core = { group = "androidx.bluetooth", name = "bluetooth-core", version = "1.0.0-alpha02" }  # УДАЛЕНО: альфа версия недоступна

# ============================================================================================
# СЕТЕВЫЕ БИБЛИОТЕКИ
# ============================================================================================
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
# webrtc = { group = "org.webrtc", name = "google-webrtc", version.ref = "webrtc" }  # УДАЛЕНО

# ============================================================================================
# БАЗЫ ДАННЫХ И ХРАНИЛИЩЕ
# ============================================================================================
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ============================================================================================
# МАТЕМАТИЧЕСКИЕ И НАУЧНЫЕ БИБЛИОТЕКИ
# ============================================================================================
commons-math3 = { group = "org.apache.commons", name = "commons-math3", version.ref = "commons-math" }
# commons-net = { group = "org.apache.commons", name = "commons-net", version.ref = "commons-net" }  # УДАЛЕНО
# mobile-ffmpeg = { group = "com.arthenica", name = "mobile-ffmpeg-full", version.ref = "ffmpeg" }  # УДАЛЕНО

# ============================================================================================
# ДОПОЛНИТЕЛЬНЫЕ БИБЛИОТЕКИ
# ============================================================================================
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }
zxing = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxing" }
chronicle-map = { group = "net.openhft", name = "chronicle-map", version.ref = "chronicle-map" }
jmdns = { group = "org.jmdns", name = "jmdns", version.ref = "jmdns" }
vorbis-java = { group = "org.gagravarr", name = "vorbis-java", version.ref = "vorbis-java" }
glide-disklrucache = { group = "com.github.bumptech.glide", name = "disklrucache", version.ref = "glide-disklrucache" }
kotlin-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.6.2" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }

# ============================================================================================
# ТЕСТИРОВАНИЕ
# ============================================================================================
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-junit" }
androidx-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.5.2" }
androidx-test-rules = { group = "androidx.test", name = "rules", version = "1.5.0" }
compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
mockito = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }

# ============================================================================================
# ПРОИЗВОДИТЕЛЬНОСТЬ И БЕНЧМАРКИ
# ============================================================================================
benchmark-junit4 = { group = "androidx.benchmark", name = "benchmark-junit4", version.ref = "benchmark" }
benchmark-macro = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
tracing = { group = "androidx.tracing", name = "tracing", version.ref = "tracing" }

[bundles]
# ============================================================================================
# ГРУППЫ СВЯЗАННЫХ БИБЛИОТЕК
# ============================================================================================

# Compose UI компоненты
compose = [
    "compose-ui",
    "compose-ui-graphics", 
    "compose-ui-tooling-preview",
    "compose-material3",
    "compose-material-icons"
]

# Compose для отладки
compose-debug = [
    "compose-ui-tooling",
    "compose-ui-test-manifest"
]

# Lifecycle компоненты
lifecycle = [
    "androidx-lifecycle-runtime",
    "androidx-lifecycle-viewmodel", 
    "androidx-lifecycle-runtime-compose"
]

# Media3 для аудио
media3 = [
    "media3-exoplayer",
    "media3-ui",
    "media3-common", 
    "media3-session"
]

# Сетевые библиотеки
network = [
    "retrofit",
    "retrofit-gson",
    "okhttp-logging"
]

# Room база данных
room = [
    "room-runtime",
    "room-ktx"
]

# Базовые тесты
testing = [
    "junit",
    "coroutines-test"
]

# Android инструментальные тесты
android-testing = [
    "androidx-test-ext-junit",
    "androidx-espresso",
    "compose-ui-test"
]

# Бенчмарки и производительность
benchmarking = [
    "benchmark-junit4",
    "benchmark-macro",
    "tracing"
]

[plugins]
# ============================================================================================
# ПЛАГИНЫ GRADLE
# ============================================================================================
android-application = { id = "com.android.application", version.ref = "android-gradle" }
android-library = { id = "com.android.library", version.ref = "android-gradle" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version = "1.23.4" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "12.0.3" }
benchmark = { id = "androidx.benchmark", version.ref = "benchmark" }